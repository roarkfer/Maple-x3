name: Build Maple X3 SD Diagnostic

on:
  push:
    branches: [main]
    paths:
      - 'diagnostics/Maple-X3-SD-Diagnostic.cpp'
      - '.github/workflows/sd-diagnostic.yml'
      - 'platformio.ini'
      - 'setup-freeink.sh'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Download pinned FreeInk SDK
        run: bash setup-freeink.sh

      - name: Prepare diagnostic source only
        run: |
          mkdir -p .saved-maple-src
          find src -maxdepth 1 -type f \( -name '*.cpp' -o -name '*.cc' -o -name '*.cxx' \) -exec mv {} .saved-maple-src/ \;
          cp diagnostics/Maple-X3-SD-Diagnostic.cpp src/main.cpp

      - name: Build SD diagnostic
        run: pio run -e xteink_x3

      - name: Prepare firmware
        run: |
          mkdir -p dist
          cp .pio/build/xteink_x3/firmware.bin dist/Maple-X3-SD-Diagnostic.bin

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: Maple-X3-SD-Diagnostic
          path: dist/Maple-X3-SD-Diagnostic.bin
