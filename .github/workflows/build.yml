name: Build Maple X3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Download FreeInk SDK
        run: bash setup-freeink.sh

      - name: Build Maple X3
        run: pio run -e xteink_x3

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: maple-x3-firmware
          path: .pio/build/xteink_x3/firmware.bin
