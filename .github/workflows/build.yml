name: Build Maple X3 Receiver

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Download pinned FreeInk SDK
        run: bash setup-freeink.sh

      - name: Fix ArduinoJson name collision
        run: |
          sed -i 's/\<detail\>/activeDetail/g' src/main.cpp
          grep -n "activeDetail" src/main.cpp | head -30

      - name: Build Maple X3 Receiver
        run: pio run -e xteink_x3

      - name: Prepare firmware
        run: |
          mkdir -p dist
          cp .pio/build/xteink_x3/firmware.bin dist/Maple-X3-Receiver-v0.2.bin

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: Maple-X3-Receiver-v0.2
          path: dist/Maple-X3-Receiver-v0.2.bin
