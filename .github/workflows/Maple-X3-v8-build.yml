name: Build Maple X3 v8

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: pip install platformio
      - name: Download pinned FreeInk SDK
        run: bash setup-freeink.sh
      - name: Build Maple X3 v8
        run: pio run -e xteink_x3
      - name: Prepare firmware
        run: |
          mkdir -p dist
          cp .pio/build/xteink_x3/firmware.bin dist/Maple-X3-v8.bin
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: Maple-X3-v8
          path: dist/Maple-X3-v8.bin
